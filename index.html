
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW ARENA</title>

<script src="https://shadow-arena-2d-battle-royale-game.onrender.com/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071014;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 18px 10px;
      background: #101f27;
      border-bottom: 2px solid #19d9e8;
    }

    h1 {
      margin: 0;
      color: #42e8f5;
      letter-spacing: 4px;
      font-size: 28px;
    }

    .subtitle {
      color: #91aeb5;
      margin-top: 7px;
      font-size: 12px;
    }

    .info {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      color: #42e8f5;
    }

    #arena {
      display: block;
      width: 95%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 8 / 5;
      margin: 5px auto;
      background: #18252a;
      border: 2px solid #42e8f5;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      margin: 25px auto;
      padding: 10px;
    }

    #joystick {
      width: 125px;
      height: 125px;
      background: #183039;
      border: 3px solid #42e8f5;
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }

    #stick {
      width: 48px;
      height: 48px;
      background: #42e8f5;
      border-radius: 50%;
      position: absolute;
      left: 35px;
      top: 35px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-weight: bold;
      font-size: 15px;
      color: white;
      background: #176b79;
      touch-action: manipulation;
    }

    #sprint {
      background: #a66a13;
    }

    #fire {
      background: #c52b39;
      padding: 19px 30px;
    }

    button:active {
      transform: scale(0.94);
      filter: brightness(1.3);
    }

    footer {
      color: #78939a;
      font-size: 12px;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SHADOW ARENA</h1>
    <div class="subtitle">MULTIPLAYER BATTLE ARENA</div>
  </header>

  <div class="info">
    <span id="status">Connecting...</span>
    <span id="count">Players: 0</span>
  </div>

  <canvas id="arena" width="800" height="500"></canvas>

  <div class="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div class="buttons">
      <button id="sprint">SPRINT</button>
      <button id="fire">FIRE</button>
    </div>

  </div>

  <footer>
    SHADOW ARENA | GAME VERSION 1.0
  </footer>

<script>
const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const countText = document.getElementById("count");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const sprintButton = document.getElementById("sprint");
const fireButton = document.getElementById("fire");

let socket;
let players = {};
let myId = null;
let connected = false;

let joyX = 0;
let joyY = 0;
let sprinting = false;

let bullets = [];

function connect() {
  if (typeof io !== "function") {
    statusText.textContent = "Server script unavailable";
    return;
  }

  // Same-origin server connection.
  // If frontend and backend are hosted separately,
  // put your backend URL inside io("YOUR_SERVER_URL").

  socket = io("https://shadow-arena-2d-battle-royale-game.onrender.com");

  socket.on("connect", () => {
    myId = socket.id;
    connected = true;
    statusText.textContent = "Connected!";
  });

  socket.on("connect_error", () => {
    statusText.textContent = "Connection failed";
  });

  socket.on("disconnect", () => {
    connected = false;
    statusText.textContent = "Disconnected";
  });

  socket.on("currentPlayers", data => {
    players = data || {};
    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("newPlayer", data => {
    if (!data || !data.id) return;

    players[data.id] = data;

    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("playerDisconnected", id => {
    delete players[id];

    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("playerMoved", data => {
    if (players[data.id]) {
      players[data.id].x = data.x;
      players[data.id].y = data.y;
    }
  });

  socket.on("shotFired", data => {
    bullets.push({
      x: data.x,
      y: data.y,
      color: data.color || "#ffff00",
      life: 30
    });
  });
}


// JOYSTICK CONTROLS

let joystickActive = false;

function moveJoystick(event) {
  if (!joystickActive) return;

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;

  const maxDistance = 38;
  const distance = Math.hypot(dx, dy);

  if (distance > maxDistance) {
    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }

  joyX = dx / maxDistance;
  joyY = dy / maxDistance;

  stick.style.left = (35 + dx) + "px";
  stick.style.top = (35 + dy) + "px";
}

function resetJoystick() {
  joystickActive = false;

  joyX = 0;
  joyY = 0;

  stick.style.left = "35px";
  stick.style.top = "35px";
}

joystick.addEventListener("pointerdown", event => {
  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  moveJoystick(event);
});

joystick.addEventListener("pointermove", moveJoystick);

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);


// SPRINT CONTROL

sprintButton.addEventListener("pointerdown", () => {
  sprinting = true;
});

sprintButton.addEventListener("pointerup", () => {
  sprinting = false;
});

sprintButton.addEventListener("pointercancel", () => {
  sprinting = false;
});

sprintButton.addEventListener("pointerleave", () => {
  sprinting = false;
});


// KEYBOARD CONTROLS

const keys = {};

document.addEventListener("keydown", event => {
  keys[event.key.toLowerCase()] = true;

  if (event.key === "Shift") {
    sprinting = true;
  }
});

document.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;

  if (event.key === "Shift") {
    sprinting = false;
  }
});


// MOVEMENT

function sendMove() {
  if (!connected || !socket) return;

  let x = joyX;
  let y = joyY;

  if (keys["arrowleft"] || keys["a"]) x -= 1;
  if (keys["arrowright"] || keys["d"]) x += 1;
  if (keys["arrowup"] || keys["w"]) y -= 1;
  if (keys["arrowdown"] || keys["s"]) y += 1;

  const length = Math.hypot(x, y);

  if (length < 0.15) return;

  if (length > 1) {
    x /= length;
    y /= length;
  }

  const speed = sprinting ? 1 : 0.7;

  socket.emit("move", {
    dx: x * speed,
    dy: y * speed
  });
}

setInterval(sendMove, 50);


// SHOOTING

fireButton.addEventListener("click", () => {
  if (!connected || !socket) {
    statusText.textContent = "Not connected";
    return;
  }

  socket.emit("shoot");
});


// DRAW GAME

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "#18252a";
  ctx.fillRect(0, 0, 800, 500);

  ctx.strokeStyle = "#263d40";
  ctx.lineWidth = 1;

  for (let x = 0; x <= 800; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 500);
    ctx.stroke();
  }

  for (let y = 0; y <= 500; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(800, y);
    ctx.stroke();
  }

  // DRAW PLAYERS

  for (const id in players) {
    const p = players[id];

    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);

    ctx.fillStyle = p.color || "#42e8f5";
    ctx.fill();

    ctx.lineWidth = 3;
    ctx.strokeStyle = id === myId ? "white" : "#111111";
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "13px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
      id === myId ? "YOU" : "PLAYER",
      p.x,
      p.y - 22
    );
  }

  // DRAW TEMPORARY SHOOTING EFFECTS

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    ctx.beginPath();
    ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);

    ctx.fillStyle = b.color;
    ctx.fill();

    b.life--;

    if (b.life <= 0) {
      bullets.splice(i, 1);
    }
  }

  countText.textContent =
    "Players: " + Object.keys(players).length;

  requestAnimationFrame(draw);
}


// START GAME

connect();
draw();

</script>

</body>
</html>
