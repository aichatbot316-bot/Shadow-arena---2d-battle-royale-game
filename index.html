
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHADOW ARENA</title>

<script src="https://shadow-arena-2d-battle-royale-game.onrender.com/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #071014;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 18px 10px;
      background: #101f27;
      border-bottom: 2px solid #19d9e8;
    }

    h1 {
      margin: 0;
      color: #42e8f5;
      letter-spacing: 4px;
      font-size: 28px;
    }

    .subtitle {
      color: #91aeb5;
      margin-top: 7px;
      font-size: 12px;
    }

    .info {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px;
      color: #42e8f5;
    }

    #arena {
      display: block;
      width: 95%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 8 / 5;
      margin: 5px auto;
      background: #18252a;
      border: 2px solid #42e8f5;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 35px;
      margin: 25px auto;
      padding: 10px;
    }

    #joystick {
      width: 125px;
      height: 125px;
      background: #183039;
      border: 3px solid #42e8f5;
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }

    #stick {
      width: 48px;
      height: 48px;
      background: #42e8f5;
      border-radius: 50%;
      position: absolute;
      left: 35px;
      top: 35px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px 25px;
      font-weight: bold;
      font-size: 15px;
      color: white;
      background: #176b79;
      touch-action: manipulation;
    }

    #sprint {
      background: #a66a13;
    }

    #fire {
      background: #c52b39;
      padding: 19px 30px;
    }

    button:active {
      transform: scale(0.94);
      filter: brightness(1.3);
    }

    footer {
      color: #78939a;
      font-size: 12px;
      padding: 15px;
    }
    
/* SHADOW ARENA MOBILE HUD */

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 800px;
  margin: 18px auto;
  padding: 12px;
  box-sizing: border-box;
}

#joystick {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  background: rgba(35, 45, 55, 0.85);
  border: 3px solid #8babb5;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
  box-shadow: 0 0 12px #000;
}

#stick {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(#d8e6eb, #657b89);
  border: 3px solid #263b48;
  box-shadow: 0 3px 8px #000;
}

.buttons {
  display: flex;
  align-items: center;
  gap: 14px;
}

.buttons button {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: 3px solid #d5e0e5;
  color: white;
  font-weight: bold;
  font-size: 13px;
  background: #263b52;
  box-shadow: 0 4px 8px #000;
}

#fire {
  width: 88px;
  height: 88px;
  background: #bd3028;
  border-color: #ffb09c;
  font-size: 16px;
}

#sprint {
  background: #287b48;
}

.buttons button:active {
  transform: scale(0.92);
}

@media (max-width: 600px) {
  #arena {
    width: 100%;
    height: auto;
  }

  .controls {
    padding: 8px;
  }

  #joystick {
    width: 105px;
    height: 105px;
  }

  .buttons {
    gap: 9px;
  }
}
    
  </style>
</head>

<body>

  <header>
    <h1>SHADOW ARENA</h1>
    <div class="subtitle">MULTIPLAYER BATTLE ARENA</div>
  </header>

  <div class="info">
    <span id="status">Connecting...</span>
    <span id="count">Players: 0</span>
  </div>

  <canvas id="arena" width="800" height="500"></canvas>

  <div class="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div class="buttons">
      <button id="sprint">SPRINT</button>
      <button id="fire">FIRE</button>
    </div>

  </div>

  <footer>
    SHADOW ARENA | GAME VERSION 1.0
  </footer>

<script>
const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const countText = document.getElementById("count");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const sprintButton = document.getElementById("sprint");
const fireButton = document.getElementById("fire");

let socket;
let players = {};
let myId = null;
let connected = false;

let joyX = 0;
let joyY = 0;
let sprinting = false;

let bullets = [];

function connect() {
  if (typeof io !== "function") {
    statusText.textContent = "Server script unavailable";
    return;
  }

  // Same-origin server connection.
  // If frontend and backend are hosted separately,
  // put your backend URL inside io("YOUR_SERVER_URL").

  socket = io("https://shadow-arena-2d-battle-royale-game.onrender.com");

  socket.on("connect", () => {
    myId = socket.id;
    connected = true;
    statusText.textContent = "Connected!";
  });

  socket.on("connect_error", () => {
    statusText.textContent = "Connection failed";
  });

  socket.on("disconnect", () => {
    connected = false;
    statusText.textContent = "Disconnected";
  });

  socket.on("currentPlayers", data => {
    players = data || {};
    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("newPlayer", data => {
    if (!data || !data.id) return;

    players[data.id] = data;

    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("playerDisconnected", id => {
    delete players[id];

    countText.textContent =
      "Players: " + Object.keys(players).length;
  });

  socket.on("playerMoved", data => {
    if (players[data.id]) {
      players[data.id].x = data.x;
      players[data.id].y = data.y;
    }
  });

  socket.on("shotFired", data => {
    bullets.push({
      x: data.x,
      y: data.y,
      color: data.color || "#ffff00",
      life: 30
    });
  });
}


// JOYSTICK CONTROLS

let joystickActive = false;

function moveJoystick(event) {
  if (!joystickActive) return;

  const rect = joystick.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;

  const maxDistance = 38;
  const distance = Math.hypot(dx, dy);

  if (distance > maxDistance) {
    dx = dx / distance * maxDistance;
    dy = dy / distance * maxDistance;
  }

  joyX = dx / maxDistance;
  joyY = dy / maxDistance;

  stick.style.left = (35 + dx) + "px";
  stick.style.top = (35 + dy) + "px";
}

function resetJoystick() {
  joystickActive = false;

  joyX = 0;
  joyY = 0;

  stick.style.left = "35px";
  stick.style.top = "35px";
}

joystick.addEventListener("pointerdown", event => {
  joystickActive = true;
  joystick.setPointerCapture(event.pointerId);
  moveJoystick(event);
});

joystick.addEventListener("pointermove", moveJoystick);

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);


// SPRINT CONTROL

sprintButton.addEventListener("pointerdown", () => {
  sprinting = true;
});

sprintButton.addEventListener("pointerup", () => {
  sprinting = false;
});

sprintButton.addEventListener("pointercancel", () => {
  sprinting = false;
});

sprintButton.addEventListener("pointerleave", () => {
  sprinting = false;
});


// KEYBOARD CONTROLS

const keys = {};

document.addEventListener("keydown", event => {
  keys[event.key.toLowerCase()] = true;

  if (event.key === "Shift") {
    sprinting = true;
  }
});

document.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;

  if (event.key === "Shift") {
    sprinting = false;
  }
});


// MOVEMENT

function sendMove() {
  if (!connected || !socket) return;

  let x = joyX;
  let y = joyY;

  if (keys["arrowleft"] || keys["a"]) x -= 1;
  if (keys["arrowright"] || keys["d"]) x += 1;
  if (keys["arrowup"] || keys["w"]) y -= 1;
  if (keys["arrowdown"] || keys["s"]) y += 1;

  const length = Math.hypot(x, y);

  if (length < 0.15) return;

  if (length > 1) {
    x /= length;
    y /= length;
  }

  const speed = sprinting ? 1 : 0.7;

  socket.emit("move", {
    dx: x * speed,
    dy: y * speed
  });
}

setInterval(sendMove, 50);


// SHOOTING

fireButton.addEventListener("click", () => {
  if (!connected || !socket) {
    statusText.textContent = "Not connected";
    return;
  }

  socket.emit("shoot");
});


// DRAW GAME


function draw() {
  // PIXEL-ART BATTLEFIELD
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grass background
  ctx.fillStyle = "#477b36";
  ctx.fillRect(0, 0, 800, 500);

  // Pixel grass details
  for (let y = 0; y < 500; y += 16) {
    for (let x = 0; x < 800; x += 16) {
      const pattern = (x * 7 + y * 13) % 5;

      if (pattern === 0) {
        ctx.fillStyle = "#568c3e";
        ctx.fillRect(x, y, 5, 5);
      } else if (pattern === 1) {
        ctx.fillStyle = "#38652f";
        ctx.fillRect(x + 7, y + 5, 4, 4);
      }
    }
  }

  // Battlefield road
  ctx.fillStyle = "#77746b";
  ctx.fillRect(0, 210, 800, 90);

  ctx.fillStyle = "#928d7e";
  ctx.fillRect(0, 214, 800, 4);
  ctx.fillRect(0, 292, 800, 4);

  // Road markings
  ctx.fillStyle = "#e6dca7";
  for (let x = 20; x < 800; x += 70) {
    ctx.fillRect(x, 252, 35, 4);
  }

  // Pixel buildings
  function building(x, y, w, h) {
    ctx.fillStyle = "#473d38";
    ctx.fillRect(x, y, w, h);

    ctx.fillStyle = "#9b8062";
    ctx.fillRect(x + 5, y + 5, w - 10, h - 10);

    ctx.fillStyle = "#594a3b";
    ctx.fillRect(x + 12, y + 12, 15, 15);

    ctx.fillStyle = "#343b43";
    ctx.fillRect(x + w - 28, y + 12, 15, 15);

    ctx.fillStyle = "#302c29";
    ctx.fillRect(x + w / 2 - 10, y + h - 28, 20, 28);
  }

  building(70, 55, 110, 90);
  building(590, 55, 130, 100);
  building(330, 350, 120, 100);

  // Pixel trees
  function tree(x, y) {
    ctx.fillStyle = "#65452d";
    ctx.fillRect(x + 10, y + 17, 10, 20);

    ctx.fillStyle = "#194c29";
    ctx.fillRect(x, y + 5, 30, 20);

    ctx.fillStyle = "#28723a";
    ctx.fillRect(x + 5, y, 20, 25);

    ctx.fillStyle = "#398b43";
    ctx.fillRect(x + 8, y + 3, 7, 7);
  }

  tree(230, 75);
  tree(510, 360);
  tree(740, 340);
  tree(250, 390);

  // DRAW PLAYERS
  for (const id in players) {
    const p = players[id];

    // Player shadow
    ctx.fillStyle = "#263326";
    ctx.fillRect(p.x - 10, p.y + 11, 22, 5);

    // Player body
    ctx.fillStyle = p.color || "#42e8f5";
    ctx.fillRect(p.x - 9, p.y - 10, 18, 23);

    // Player head
    ctx.fillStyle = "#f0c69b";
    ctx.fillRect(p.x - 6, p.y - 17, 12, 9);

    // Helmet
    ctx.fillStyle = "#263c54";
    ctx.fillRect(p.x - 8, p.y - 19, 16, 6);

    // Arms
    ctx.fillStyle = "#d4d9df";
    ctx.fillRect(p.x - 14, p.y - 7, 5, 13);
    ctx.fillRect(p.x + 9, p.y - 7, 5, 13);

    // Outline
    ctx.strokeStyle = id === myId ? "#ffffff" : "#202020";
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x - 9, p.y - 10, 18, 23);

    // Player name
    ctx.fillStyle = "white";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText(id === myId ? "YOU" : "PLAYER", p.x, p.y - 25);
  }

  // TEMPORARY SHOOTING EFFECTS
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];

    ctx.fillStyle = b.color || "#ffff00";
    ctx.fillRect(b.x - 3, b.y - 3, 7, 7);

    b.life--;

    if (b.life <= 0) {
      bullets.splice(i, 1);
    }
  }

  countText.textContent =
    "Players: " + Object.keys(players).length;

  requestAnimationFrame(draw);
}
  


// START GAME

connect();
draw();

</script>

</body>
</html>
