<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SHADOW ARENA: BATTLE ROYALE</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}
header { text-align: center; padding: 6px; }
h1 { color: #42e8f5; margin: 2px; font-size: 23px; }
#status { color: #ffd166; font-size: 13px; margin: 4px; }
#count { font-size: 12px; }
#arena {
  display: block;
  width: 100%;
  max-width: 800px;
  height: auto;
  margin: 4px auto;
  background: #18252a;
  border: 2px solid #42e8f5;
  touch-action: none;
}
#hud { position: fixed; inset: 0; pointer-events: none; }
#joystick {
  position: absolute; left: 22px; bottom: 25px;
  width: 135px; height: 135px;
  border: 3px solid #ffffff88; border-radius: 50%;
  background: #aabccc22; pointer-events: auto;
  touch-action: none;
}
#stick {
  position: absolute; left: 38px; top: 38px;
  width: 53px; height: 53px; border-radius: 50%;
  background: #42e8f5bb; border: 2px solid white;
}
.action {
  position: absolute; width: 62px; height: 62px;
  border-radius: 50%; color: white; font-weight: bold;
  font-size: 12px; background: #172d3cdd;
  border: 2px solid #42e8f5;
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto; touch-action: none;
}
#fire { right: 22px; bottom: 35px; width: 76px; height: 76px; background: #a62929dd; border-color: #ff7777; }
#jump { right: 100px; bottom: 115px; }
#sprint { right: 22px; bottom: 130px; }
#crouch { right: 98px; bottom: 35px; }
#hint { position: fixed; top: 88px; right: 8px; font-size: 10px; color: #ffffff99; }
@media (orientation: landscape) {
  header { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; padding: 2px; }
  h1 { font-size: 17px; }
  #arena { width: 100vw; height: 100dvh; max-width: none; margin: 0; }
  #status, #count { font-size: 10px; }
  #joystick { width: 120px; height: 120px; left: 22px; bottom: 20px; }
  #stick { left: 33px; top: 33px; }
  #fire { right: 22px; bottom: 25px; }
  #jump { right: 100px; bottom: 110px; }
  #sprint { right: 22px; bottom: 120px; }
  #crouch { right: 100px; bottom: 25px; }
}
</style>
</head>
<body>
<header>
  <h1>SHADOW ARENA</h1>
  <div>BATTLE ROYALE</div>
  <div id="status">Connecting to server...</div>
  <div id="count">Players: 0</div>
</header><canvas id="arena" width="800" height="500"></canvas>

<div id="hud">
  <div id="joystick"><div id="stick"></div></div>
  <button class="action" id="fire">FIRE</button>
  <button class="action" id="jump">JUMP</button>
  <button class="action" id="sprint">RUN</button>
  <button class="action" id="crouch">CROUCH</button>
</div>
<div id="hint">2D MULTIPLAYER TEST</div><script src="/socket.io/socket.io.js"></script><script>
const canvas = document.getElementById("arena");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const countText = document.getElementById("count");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let socket, players = {}, myId = null, connected = false;
  let bullets = [];
let joyX = 0, joyY = 0, sprinting = false;

function connect() {
  if (typeof io !== "function") {
    statusText.textContent = "Server script unavailable";
    return;
  }

  socket = io();
  socket = io();

  socket.on("connect", () => {
    myId = socket.id;
    connected = true;
    statusText.textContent = "Connected!";
  });

  socket.on("disconnect", () => {
    connected = false;
    statusText.textContent = "Disconnected";
  });
  socket.on("connect", () => {
    connected = true;
    myId = socket.id;
    statusText.textContent = "CONNECTED";
  });

  socket.on("connect_error", () => {
    statusText.textContent = "Connection failed";
  });

  socket.on("disconnect", () => {
    connected = false;
    statusText.textContent = "Disconnected";
  });
  socket.on("players", data => {
    players = data;
    countText.textContent = Object.keys(players).length;
  });
    socket.on("playerJoined", data => {
    players[data.id] = data;
    countText.textContent = Object.keys(players).length;
  });
    socket.on("playerDisconnected", data => {
    delete players[data.id];

    countText.textContent = Object.keys(players).length;
  });
    socket.on("playerMoved", data => {
    if (players[data.id]) {
      players[data.id].x = data.x;
      players[data.id].y = data.y;
    }
  });
    socket.on("shotFired", data => {
    bullets.push({
      x: data.x,
      y: data.y,
      color: data.color || "#ffff00",
      life: 30
    });
  });
  socket.on("currentPlayers", data => players = data || {});
  socket.on("newPlayer", p => players[p.id] = p);

  socket.on("playerMoved", data => {
    if (players[data.id]) {
      players[data.id].x = data.x;
      players[data.id].y = data.y;
    }
  });
socket.on("shotFired", data => {
  bullets.push({
    x: data.x,
    y: data.y,
    color: data.color || "#ffff00",
    life: 30
  });
});
  socket.on("playerDisconnected", id => delete players[id]);
}

function sendMove() {
  if (!connected || !socket) return;
  let length = Math.hypot(joyX, joyY);
  if (length < 0.15) return;
  let speed = sprinting ? 1 : 0.7;
  socket.emit("move", { dx: joyX * speed, dy: joyY * speed });
}

let activePointer = null;

joystick.addEventListener("pointerdown", e => {
  e.preventDefault();
  activePointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  updateStick(e);
});

joystick.addEventListener("pointermove", e => {
  if (e.pointerId === activePointer) updateStick(e);
});

function updateStick(e) {
  const r = joystick.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const max = r.width * 0.32;
  const len = Math.hypot(dx, dy);
  if (len > max) { dx = dx / len * max; dy = dy / len * max; }
  joyX = dx / max;
  joyY = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

function stopStick(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  joyX = joyY = 0;
  stick.style.transform = "translate(0,0)";
}

joystick.addEventListener("pointerup", stopStick);
joystick.addEventListener("pointercancel", stopStick);
setInterval(sendMove, 100);

const runButton = document.getElementById("sprint");
runButton.addEventListener("pointerdown", e => {
  e.preventDefault(); sprinting = true;
});
["pointerup", "pointercancel", "pointerleave"].forEach(type => {
  runButton.addEventListener(type, () => sprinting = false);
});

document.getElementById("fire").addEventListener("click", () => {
  statusText.textContent = "Shooting feature coming soon";
});
document.getElementById("jump").addEventListener("click", () => {
  statusText.textContent = "Jump feature coming soon";
});
document.getElementById("crouch").addEventListener("click", () => {
  statusText.textContent = "Crouch feature coming soon";
});

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#18252a";
  ctx.fillRect(0, 0, 800, 500);
  ctx.strokeStyle = "#263d40";

  for (let x = 0; x <= 800; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 500); ctx.stroke();
  }
  for (let y = 0; y <= 500; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(800, y); ctx.stroke();
  }

  for (const id in players) {
    const p = players[id];
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
    ctx.fillStyle = p.color || "#42e8f5";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = id === myId ? "white" : "#111111";
    ctx.stroke();
    ctx.fillStyle = "white";
    ctx.font = "13px Arial";
    ctx.textAlign = "center";
    ctx.fillText(id === myId ? "YOU" : "PLAYER", p.x, p.y - 22);
  }

  countText.textContent = "Players: " + Object.keys(players).length;
  requestAnimationFrame(draw);
}

connect();
draw();
</script></body>
</html>
